name: portfolio
description: "Personal portfolio developed with Flutter. This project showcases my skills, experience, and professional background as a mobile developer, with smooth navigation, custom UI, and integration with social and project links."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  custom_button_builder: ^0.0.4
  device_frame: ^1.2.0
  google_fonts: ^6.2.1
  provider: ^6.1.5
  font_awesome_flutter: ^10.8.0
  url_launcher: ^6.3.1
  flutter_animate: ^4.5.2
  flutter_svg: ^2.1.0
  auto_size_text: ^3.0.0
  rive: ^0.13.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/rive/
